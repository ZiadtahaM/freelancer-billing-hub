kind = "web"
previewPath = "/"
title = "MenuStack"
version = "1.0.0"
id = "artifacts/menustack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25130

[services.development]
run = "pnpm --filter @workspace/menustack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/menustack", "run", "build" ]
publicDir = "artifacts/menustack/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25130"
BASE_PATH = "/"
